<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650" role="img" aria-labelledby="title desc">
<title id="title">Four ways Hermes reaches real tools</title><desc id="desc">A profile reaches Google Workspace through a local CLI and OAuth, connected apps through Composio, an agent-owned inbox through the AgentMail API, and servers through MCP. Each route has its own authority. Reads and writes need different approval policies.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7a7067"/></marker></defs>
<style>.title{font:30px Georgia,serif;fill:#2a2622}.label{font:600 20px Arial,sans-serif;fill:#2a2622}.body{font:17px Arial,sans-serif;fill:#7a7067}.small{font:15px Arial,sans-serif;fill:#7a7067}.box{fill:#fffdf9;stroke:#d9cfc3;stroke-width:2}.line{fill:none;stroke:#7a7067;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1100" height="650" fill="#f6f1ea"/><text x="45" y="60" class="title">Connected does not mean equally authorized</text><text x="45" y="98" class="body">Keep credential source, account, and permissions explicit for each route.</text>
<rect x="45" y="230" width="215" height="230" rx="14" fill="#fffdf9" stroke="#c2932f" stroke-width="2"/>
<text x="70" y="270" class="label">Hermes profile</text><text x="70" y="310" class="body">Instructions</text><text x="70" y="342" class="body">Selected skills</text><text x="70" y="374" class="body">Local credentials</text><text x="70" y="425" class="small">Not every worker inherits it</text>
<path d="M260 275H305V180H345" class="line"/><path d="M260 315H345" class="line"/><path d="M260 375H305V440H345" class="line"/><path d="M260 420H290V565H345" class="line"/>
<rect x="350" y="135" width="310" height="90" rx="12" class="box"/><text x="375" y="171" class="label">Google wrapper + gws</text><text x="375" y="201" class="body">Own OAuth client + token</text>
<rect x="350" y="265" width="310" height="90" rx="12" class="box"/><text x="375" y="301" class="label">Composio</text><text x="375" y="331" class="body">Login, then link each account</text>
<rect x="350" y="395" width="310" height="90" rx="12" class="box"/><text x="375" y="431" class="label">AgentMail API</text><text x="375" y="461" class="body">Separate inbox + API key</text>
<rect x="350" y="525" width="310" height="90" rx="12" class="box"/><text x="375" y="561" class="label">MCP client</text><text x="375" y="591" class="body">Selected server + its auth</text>
<path d="M660 180H720V270H775" class="line"/><path d="M660 310H775" class="line"/><path d="M660 440H720V360H775" class="line"/><path d="M660 570H745V410H775" class="line"/>
<rect x="780" y="225" width="275" height="240" rx="14" class="box"/><text x="805" y="263" class="label">Operation policy</text><text x="805" y="305" class="body">Verify one harmless read</text><path d="M800 330H1035" stroke="#c2932f" stroke-dasharray="5 5"/><text x="805" y="365" class="body">Approve external writes</text><text x="805" y="397" class="body">Check actual permissions</text><text x="805" y="435" class="small">A prompt is not an ACL</text>
</svg>