<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 475" role="img" aria-labelledby="title desc">
<title id="title">Honcho connection is not identity verification</title><desc id="desc">Activation, connection, write, recall, and intended identity are distinct checks. The first four worked in Hal's test, while unified attribution across desktop and phone remained unverified. Different peers can both have working recall.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#7a7067"/></marker></defs>
<style>.title{font:26px Georgia,serif;fill:#2a2622}.h{font:18px Georgia,serif;fill:#2a2622}.l{font:14px Arial,sans-serif;fill:#2a2622}.s{font:12.5px Arial,sans-serif;fill:#7a7067}.box{fill:#fffdf9;stroke:#d9cfc3;stroke-width:1.5}.line{fill:none;stroke:#7a7067;stroke-width:1.5;marker-end:url(#arrow)}</style>
<rect width="1000" height="475" fill="#f6f1ea"/><text x="35" y="48" class="title">Five checks, not one green status light</text><text x="35" y="77" class="s">My connection and recall worked. A single intended identity across channels was not proven.</text>
<rect x="35" y="115" width="160" height="95" rx="10" class="box"/><text x="53" y="148" class="h">1 · Activation</text><text x="53" y="174" class="s">Plugin is selected</text><text x="53" y="194" class="s">in the right profile</text>
<rect x="220" y="115" width="160" height="95" rx="10" class="box"/><text x="238" y="148" class="h">2 · Connection</text><text x="238" y="174" class="s">Service reachable</text><text x="238" y="194" class="s">and authenticated</text>
<rect x="405" y="115" width="160" height="95" rx="10" class="box"/><text x="423" y="148" class="h">3 · Write</text><text x="423" y="174" class="s">Non-sensitive fact</text><text x="423" y="194" class="s">was persisted</text>
<rect x="590" y="115" width="160" height="95" rx="10" class="box"/><text x="608" y="148" class="h">4 · Recall</text><text x="608" y="174" class="s">Later session can</text><text x="608" y="194" class="s">retrieve that fact</text>
<rect x="775" y="115" width="190" height="95" rx="10" fill="#fffdf9" stroke="#c2932f" stroke-width="2"/><text x="793" y="148" class="h">5 · Attribution</text><text x="793" y="174" class="s">Does it belong to the</text><text x="793" y="194" class="s">intended shared peer?</text>
<path d="M195 161H215" class="line"/><path d="M380 161H400" class="line"/><path d="M565 161H585" class="line"/><path d="M750 161H770" class="line"/>
<rect x="100" y="265" width="220" height="70" rx="10" class="box"/><text x="120" y="294" class="h">Desktop conversation</text><text x="120" y="317" class="s">One effective peer identity</text>
<rect x="100" y="360" width="220" height="70" rx="10" class="box"/><text x="120" y="389" class="h">Phone conversation</text><text x="120" y="412" class="s">A platform-derived identity</text>
<path d="M320 300H425" class="line"/><path d="M320 395H425" class="line"/>
<rect x="435" y="265" width="220" height="70" rx="10" class="box"/><text x="455" y="295" class="l">Recall can succeed here</text><text x="455" y="317" class="s">even when peers differ</text>
<rect x="435" y="360" width="220" height="70" rx="10" class="box"/><text x="455" y="390" class="l">Recall can succeed here</text><text x="455" y="412" class="s">without sharing desktop facts</text>
<text x="700" y="300" class="l">An empty peer card alone</text><text x="700" y="322" class="l">does not diagnose failure.</text><text x="700" y="370" class="s">Test fresh sessions and inspect</text><text x="700" y="392" class="s">both profile and peer attribution.</text><text x="700" y="414" class="s">Don't manufacture a fix with duplicates.</text>
</svg>
