<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc">
<title id="title">Facts, procedures and retrieved history</title><desc id="desc">Built-in memory is a compact local snapshot in the prompt. Skills are local procedures loaded when needed. Honcho Cloud stores conversations and derived conclusions for retrieval. Local session history is separate evidence. None is a guarantee of truth.</desc>
<style>.title{font:26px Georgia,serif;fill:#2a2622}.h{font:20px Georgia,serif;fill:#2a2622}.l{font:14px Arial,sans-serif;fill:#2a2622}.s{font:12.5px Arial,sans-serif;fill:#7a7067}.code{font:12px Menlo,monospace;fill:#2a2622}.box{fill:#fffdf9;stroke:#d9cfc3;stroke-width:1.5}</style>
<rect width="1000" height="550" fill="#f6f1ea"/><text x="35" y="48" class="title">Choose the store by the retrieval you need</text><text x="35" y="77" class="s">Persistent information has different jobs. These are not three copies of the same memory.</text>
<rect x="35" y="110" width="295" height="280" rx="12" class="box"/><text x="55" y="148" class="h">Built-in notes</text><text x="55" y="180" class="code">MEMORY.md · 2,200 chars</text><text x="55" y="204" class="code">USER.md · 1,375 chars</text><text x="55" y="246" class="l">Facts for every session</text><text x="55" y="272" class="s">Machine, preferred name,</text><text x="55" y="292" class="s">stable communication preferences.</text><text x="55" y="332" class="s">Local files → session-start snapshot</text><text x="55" y="358" class="s">Full budget → consolidate, then retry</text>
<rect x="350" y="110" width="295" height="280" rx="12" class="box"/><text x="370" y="148" class="h">Skills</text><text x="370" y="180" class="code">skill-name/SKILL.md</text><text x="370" y="204" class="s">+ optional scripts and references</text><text x="370" y="246" class="l">Procedures for relevant tasks</text><text x="370" y="272" class="s">Verification steps, writing rules,</text><text x="370" y="292" class="s">a repeatable debugging workflow.</text><text x="370" y="332" class="s">Local instructions → on-demand load</text><text x="370" y="358" class="s">Review before granting tool access</text>
<rect x="665" y="110" width="300" height="280" rx="12" fill="#fffdf9" stroke="#c2932f" stroke-width="2"/><text x="685" y="148" class="h">Honcho (optional)</text><text x="685" y="180" class="code">conversations + conclusions</text><text x="685" y="204" class="s">peer cards, summaries and search</text><text x="685" y="246" class="l">Recall beyond the small notes</text><text x="685" y="272" class="s">What was discussed, which decision</text><text x="685" y="292" class="s">was made, and the source messages.</text><text x="685" y="332" class="s">Cloud in my setup → retrieved context</text><text x="685" y="358" class="s">Verify identity as well as connection</text>
<rect x="35" y="420" width="930" height="90" rx="12" class="box"/><text x="55" y="451" class="h">Evidence is still separate</text><text x="55" y="478" class="l">Local session history, source files and real tool output let me check a remembered claim.</text><text x="55" y="499" class="s">More persistent recall does not make an incorrect claim true.</text>
</svg>
