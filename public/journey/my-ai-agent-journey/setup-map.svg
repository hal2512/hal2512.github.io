<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 850" role="img" aria-labelledby="title desc">
<title id="title">My Hermes setup after ten days</title>
<desc id="desc">Desktop and phone clients reach Hermes on an awake Mac. Remote model providers, Honcho and connected accounts sit outside the Mac. Inside it, local tools, memory, skills, scheduled jobs and staff profiles organize work. Multica is a separate external board connected to local workers; Hermes Kanban coordinates the permanent staff.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#7a7067" stroke-width="1.3"/></marker></defs>
<style>text{fill:#2a2622;font-family:Arial,sans-serif;font-size:17px}.heading{font-family:Georgia,serif;font-size:29px}.label{font-size:20px;font-weight:600}.small{font-size:15px;fill:#7a7067}.box{fill:#fffaf4;stroke:#d9cfc3;stroke-width:1.5}.flow{fill:none;stroke:#7a7067;stroke-width:1.5;marker-end:url(#arrow)}.accent{fill:#c2932f}</style>
<rect width="1120" height="850" fill="#f6f1ea"/>
<text x="40" y="49" class="heading">One local host, several external services</text>
<text x="40" y="78" class="small">Logical setup map · November 2026 · arrows show relationships, not exact transport</text>
<rect x="40" y="112" width="1040" height="93" rx="12" class="box"/>
<text x="62" y="144" class="label">Ways I talk to it</text>
<text x="62" y="177">Desktop app</text><text x="330" y="177">iMessage → Photon</text><text x="678" y="177">Telegram → Bot API</text>
<path d="M560 205V250" class="flow"/>
<rect x="40" y="250" width="690" height="530" rx="15" fill="none" stroke="#c2932f" stroke-width="2"/>
<text x="62" y="285" class="label">MacBook Air M4 · must be awake</text>
<rect x="64" y="310" width="642" height="77" rx="10" class="box"/>
<text x="85" y="340" class="label">Hermes backend + gateway</text>
<text x="85" y="367" class="small">Model requests, tools, messaging and scheduled dispatch</text>
<path d="M385 387V418" class="flow"/>
<rect x="64" y="423" width="305" height="112" rx="10" class="box"/>
<text x="84" y="452" class="label">Local tools</text>
<text x="84" y="482">cua-driver · Mac apps</text><text x="84" y="511">faster-whisper · audio to text</text>
<rect x="390" y="423" width="316" height="112" rx="10" class="box"/>
<text x="410" y="452" class="label">Local context</text>
<text x="410" y="482">Built-in memory · compact facts</text><text x="410" y="511">Skills · reusable procedures</text>
<rect x="64" y="555" width="642" height="77" rx="10" class="box"/>
<text x="84" y="586" class="label">Scheduled jobs</text>
<text x="84" y="612">Fresh agent runs or fixed scripts → delivery routing</text>
<rect x="64" y="652" width="642" height="102" rx="10" class="box"/>
<text x="84" y="682" class="label">Hermes Kanban → permanent staff profiles</text>
<text x="84" y="711">Chief of staff hands off bounded work; specialists report back.</text>
<text x="84" y="737" class="small">Multica-launched isolated workers are a separate workflow.</text>
<rect x="790" y="250" width="290" height="115" rx="10" class="box"/>
<text x="811" y="282" class="label">Remote models</text>
<text x="811" y="312">Anthropic · Claude</text><text x="811" y="341">OpenAI · ChatGPT models</text>
<path d="M706 334H755V307H785" class="flow"/>
<rect x="790" y="390" width="290" height="99" rx="10" class="box"/>
<text x="811" y="422" class="label">Honcho Cloud</text>
<text x="811" y="451">External conversation recall</text><text x="811" y="475" class="small">Identity mapping still unresolved</text>
<path d="M706 478H760V440H785" class="flow"/>
<rect x="790" y="514" width="290" height="122" rx="10" class="box"/>
<text x="811" y="546" class="label">Connected accounts</text>
<text x="811" y="575">Google · AgentMail · Composio</text><text x="811" y="603">MCP tool servers</text><text x="811" y="625" class="small">Separate credentials and permissions</text>
<path d="M730 575H785" class="flow"/>
<rect x="790" y="661" width="290" height="93" rx="10" class="box"/>
<text x="811" y="693" class="label">Multica board</text>
<text x="811" y="723">Task visibility + isolated workers</text>
<path d="M790 737H736" class="flow"/>
<text x="40" y="821" class="small">A local process does not make every data path local. Verify results at each boundary.</text>
</svg>
